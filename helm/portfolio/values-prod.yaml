# Production values for the homelab (ArgoCD Application `portfolio`).
# Image tags are pinned to commit shas by .github/workflows/release.yml. Do not
# edit them by hand except for rollback: pin a previous sha tag and ArgoCD rolls
# back (the sha images stay in GHCR).
web:
  image:
    tag: "1fb18f259ee686e442a2e78a1d408e770f99198b"
    pullPolicy: IfNotPresent
api:
  image:
    tag: "b8e4fee1317a152f1f5605e0400aebd2370ea883"
    pullPolicy: IfNotPresent
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: portfolio.bsoapp.net
      paths:
        - path: /
          pathType: Prefix
