apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portfolio.fullname" . }}-api-config
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  config.yaml: |
    server:
      port: {{ .Values.api.port }}
      log_level: {{ .Values.api.logLevel }}
      cors_allowed_origins:
        {{- toYaml .Values.api.corsAllowedOrigins | nindent 8 }}
    prometheus:
      url: {{ .Values.api.prometheus.url | quote }}
      query_timeout: {{ .Values.api.prometheus.queryTimeout | quote }}
      cache_ttl: {{ .Values.api.prometheus.cacheTTL | quote }}
    services:
      {{- toYaml .Values.api.services | nindent 6 }}
    custom_metrics:
      {{- toYaml .Values.api.customMetrics | nindent 6 }}
