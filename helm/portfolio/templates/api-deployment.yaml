apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portfolio.fullname" . }}-api
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.api.prometheus.url | quote }}
            - name: PROMETHEUS_QUERY_TIMEOUT
              value: {{ .Values.api.prometheus.queryTimeout | quote }}
            - name: PROMETHEUS_CACHE_TTL
              value: {{ .Values.api.prometheus.cacheTTL | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," .Values.api.corsAllowedOrigins | quote }}
            {{- with .Values.api.services }}
            - name: SERVICES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.api.customMetrics }}
            - name: CUSTOM_METRICS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: {{ .Values.api.probes.port }}
            initialDelaySeconds: {{ .Values.api.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: {{ .Values.api.probes.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
